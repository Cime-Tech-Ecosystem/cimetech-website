        .contour { position: relative; isolation: isolate; overflow: hidden; --contour-color: rgba(255,255,255,.10); }
        .contour-light { --contour-color: rgba(41,59,102,.09); }
        .contour-mint { --contour-color: rgba(51,107,100,.16); }
        .contour::before {
            content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
            background-color: var(--contour-color);
            -webkit-mask-image: var(--contour-img); mask-image: var(--contour-img);
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
            -webkit-mask-position: center; mask-position: center;
            -webkit-mask-size: cover; mask-size: cover;
        }
        .contour-flip::before { transform: scaleX(-1); }

        /* ===== How We Work: connector arrows between steps ===== */
        .flow-arrow {
            position: relative; flex: 1 1 0%; min-width: 20px; height: 1px; margin: 20px 14px 0;
            background: linear-gradient(90deg, rgba(255,255,255,.10), rgba(255,255,255,.55));
        }
        .flow-arrow::after {
            content: ""; position: absolute; right: 2px; top: 50%; width: 8px; height: 8px;
            border-top: 1px solid rgba(255,255,255,.7); border-right: 1px solid rgba(255,255,255,.7);
            transform: translateY(-50%) rotate(45deg);
        }
        @media (max-width: 767px) {
            .flow-arrow {
                flex: none; width: 1px; height: 36px; min-width: 0; margin: 10px 0;
                background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.55));
            }
            .flow-arrow::after {
                right: auto; top: auto; left: 50%; bottom: 2px;
                transform: translateX(-50%) rotate(45deg);
                border-top: 0; border-right: 1px solid rgba(255,255,255,.7); border-bottom: 1px solid rgba(255,255,255,.7);
            }
        }

        /* ===== Scroll reveal (only active when JS is running) ===== */
        .reveal { transition: opacity .8s ease var(--d,0s), translate .8s cubic-bezier(.22,.7,.2,1) var(--d,0s), transform .4s cubic-bezier(.22,.7,.2,1), box-shadow .4s ease, border-color .4s ease; }
        .js .reveal { opacity: 0; translate: 0 28px; }
        .js .reveal.is-visible { opacity: 1; translate: 0 0; }
        .js .flow-arrow.reveal { translate: 0 0; }

        /* ===== Card hover transition ===== */
        .card-accent { position: relative; overflow: hidden; }
        .card-accent::after {
            content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
            background: linear-gradient(90deg, #762837, #336b64);
            transform: scaleX(0); transform-origin: left; transition: transform .5s cubic-bezier(.22,.7,.2,1);
        }
        .icon-chip {
            display: inline-flex; align-items: center; justify-content: center; flex: none;
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(51,107,100,.12); color: #336b64;
            transition: background-color .4s ease, color .4s ease, transform .4s cubic-bezier(.22,.7,.2,1);
        }
        .card-lift img { transition: transform .7s cubic-bezier(.22,.7,.2,1); }
        .step img { transition: transform .4s cubic-bezier(.22,.7,.2,1); }
        @media (hover: hover) {
            .card-lift:hover { transform: translateY(-8px); box-shadow: 0 22px 44px -16px rgba(41,59,102,.45); }
            .card-accent:hover { border-color: #336b64; }
            .card-accent:hover::after { transform: scaleX(1); }
            .card-lift:hover .icon-chip { background: #336b64; color: #fff; transform: rotate(-6deg) scale(1.08); }
            .card-lift:hover img { transform: scale(1.04); }
            .step:hover img { transform: translateY(-4px) scale(1.1); }
        }
        @media (prefers-reduced-motion: reduce) {
            .js .reveal, .js .reveal.is-visible { opacity: 1; translate: none; transition: none; }
            .card-lift, .card-lift img, .card-accent::after, .icon-chip, .step img { transition: none; }
        }

        /* ===== Anchor (link & button) transitions ===== */
        a { transition: color .3s ease, background-color .3s ease, border-color .3s ease, box-shadow .3s ease, opacity .3s ease, transform .3s ease; }
        .col2 a:hover, #mobile-menu .flex-col a:hover, footer nav a:hover { color: #D4D0C4; }
        a[class*="bg-[#762837]"]:hover { background-color: #5E1F2C; box-shadow: 0 10px 22px -10px rgba(118,40,55,.7); }
        a[class*="border-white"]:hover { background-color: rgba(255,255,255,.14); }
        a:focus-visible { outline: 2px solid #D4D0C4; outline-offset: 3px; }

        /* ===== Active page, accordion, forms ===== */
        .col2 a[aria-current="page"], #mobile-menu a[aria-current="page"], footer a[aria-current="page"] { color: #D4D0C4; text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 2px; }
        details > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1rem; font-weight: 700; color: #293b66; }
        details > summary::-webkit-details-marker { display: none; }
        details > summary::after { content: "+"; transition: transform .3s ease; font-size: 1.4rem; line-height: 1; }
        details[open] > summary::after { transform: rotate(45deg); }
        .field { width: 100%; border: 1px solid #d4d0c4; border-radius: 8px; background: #fff; padding: .75rem; color: #141b2e; min-height: 48px; transition: border-color .3s ease, box-shadow .3s ease; }
        .field[aria-invalid="true"] { border-color: #762837; }
        .field:focus { outline: none; border-color: #336b64; box-shadow: 0 0 0 3px rgba(51,107,100,.2); }

    <script>
        (function () {
            var items = document.querySelectorAll('.reveal');
            if (!('IntersectionObserver' in window)) {
                items.forEach(function (el) { el.classList.add('is-visible'); });
                return;
            }
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                    if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
                });
            }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
            items.forEach(function (el) { io.observe(el); });
        })();
    </script>

    <script>
        (function () {
            var LABELS = { name: 'Name', phone: 'Phone', email: 'Email', when: 'Preferred date and time', space: 'Space of interest', people: 'Number of people', service: 'Service', message: 'Project details' };
            function setError(input, msg) {
                var label = input.closest('label'), p = label.querySelector('.field-error');
                if (!p) { p = document.createElement('span'); p.className = 'field-error block mt-1 text-sm font-normal text-[#762837]'; p.setAttribute('role', 'alert'); label.appendChild(p); }
                p.textContent = msg || '';
                if (msg) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
                return !msg;
            }
            function check(input) {
                var v = input.value.trim();
                if (input.name === 'name') return setError(input, v ? '' : 'Please enter your name.');
                if (input.name === 'phone') {
                    var digits = v.replace(/\D/g, '');
                    if (!v) return setError(input, 'Please enter your phone number.');
                    if (!/^\+?[0-9\s()-]+$/.test(v) || digits.length < 10 || digits.length > 15) return setError(input, 'Please enter a valid phone number, for example +234 816 416 9025.');
                    return setError(input, '');
                }
                if (input.name === 'email') {
                    if (!v) return setError(input, 'Please enter your email address.');
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return setError(input, 'Please enter a valid email address.');
                    return setError(input, '');
                }
                return true;
            }
            document.querySelectorAll('form[data-title]').forEach(function (f) {
                f.setAttribute('novalidate', '');
                var note = f.querySelector('.form-note'), btn = f.querySelector('button[type="submit"]');
                var req = f.querySelectorAll('input[name="name"], input[name="phone"], input[name="email"]');
                req.forEach(function (i) {
                    i.addEventListener('blur', function () { check(i); });
                    i.addEventListener('input', function () { if (i.getAttribute('aria-invalid')) check(i); });
                });
                f.addEventListener('submit', function (e) {
                    e.preventDefault();
                    var d = new FormData(f);
                    if (d.get('website')) return;
                    var firstBad = null;
                    req.forEach(function (i) { if (!check(i) && !firstBad) firstBad = i; });
                    if (firstBad) { note.textContent = 'Please correct the highlighted fields.'; firstBad.focus(); return; }
                    var m = f.dataset.title + '\n';
                    d.forEach(function (v, k) { v = String(v).trim(); if (k !== 'website' && v) m += (LABELS[k] || k) + ': ' + v + '\n'; });
                    var win = window.open('https://wa.me/2348164169025?text=' + encodeURIComponent(m), '_blank', 'noopener');
                    if (!win) { note.textContent = 'We could not open WhatsApp. Please call or message us on +234 816 416 9025.'; return; }
                    note.textContent = 'WhatsApp is opening with your details. Please press Send there to complete your request.';
                    if (window.cimeTrack) window.cimeTrack('Form Submit', { form: f.dataset.title });
                    btn.disabled = true; btn.classList.add('opacity-60');
                    setTimeout(function () { btn.disabled = false; btn.classList.remove('opacity-60'); }, 8000);
                });
            });
        })();
    </script>
